name: CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  detect:
    name: Detect Go packages
    runs-on: ubuntu-latest
    outputs:
      has-packages: ${{ steps.detect.outputs.has-packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - id: detect
        shell: bash
        run: |
          if packages="$(go list ./... 2>/dev/null)" && [ -n "$packages" ]; then
            echo "has-packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-packages=false" >> "$GITHUB_OUTPUT"
            echo "No Go packages exist yet; code validation will run after project sources are added."
          fi

  lint:
    name: Format, lint, and vet
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has-packages == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofumpt formatting
        run: |
          go install mvdan.cc/gofumpt@v0.8.0
          test -z "$(gofumpt -l .)"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Run go vet
        run: go vet ./...

  test:
    name: Race tests and coverage
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has-packages == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test with race detector and coverage
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Enforce internal coverage
        run: |
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, \"\", $3); print $3}')"
          test -n "$coverage"
          awk -v coverage="$coverage" 'BEGIN { if (coverage < 80) { printf \"internal coverage %.1f%% is below 80%%\\n\", coverage; exit 1 } }'

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has-packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -o "dist/istio-route-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/istio-route

  goreleaser-check:
    name: Validate GoReleaser configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: check

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [detect, lint, test, build, goreleaser-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
