apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: selected
spec:
  parentRefs:
    - name: waypoint
  rules:
    - backendRefs:
        - name: reviews
          port: 9080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unrelated
spec:
  parentRefs:
    - name: other-gateway
  rules:
    - backendRefs:
        - name: ratings
          port: 9080
