apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio-waypoint
spec:
  controllerName: istio.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: app
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: a
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: b
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: same
      port: 81
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: tcp
      port: 9000
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: other
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ambient
  namespace: app
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: accepted-a-rejected-b
  namespace: app
  generation: 3
spec:
  parentRefs:
    - name: waypoint
  rules:
    - backendRefs:
        - name: reviews
          port: 9080
status:
  parents:
    - parentRef:
        name: waypoint
        sectionName: a
      controllerName: istio.io/gateway-controller
      conditions:
        - type: Accepted
          status: "True"
          reason: Accepted
          observedGeneration: 3
    - parentRef:
        name: waypoint
        sectionName: b
      controllerName: istio.io/gateway-controller
      conditions:
        - type: Accepted
          status: "False"
          reason: NotAllowedByListeners
          message: listener b rejects this route
          observedGeneration: 3
---
