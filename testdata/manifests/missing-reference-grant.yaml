apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: example
spec:
  controllerName: example.com/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: app
spec:
  gatewayClassName: example
  listeners:
    - name: https
      hostname: shop.example.com
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: app
spec:
  parentRefs:
    - name: edge
  hostnames:
    - shop.example.com
  rules:
    - backendRefs:
        - name: api
          namespace: backend
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: backend
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
