apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio-waypoint
spec:
  controllerName: istio.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: waypoint
  namespace: mesh
  generation: 1
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: hbone
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      observedGeneration: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: other
  namespace: mesh
  generation: 1
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: hbone
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
status:
  conditions:
    - type: Accepted
      status: "True"
      reason: Accepted
      observedGeneration: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alpha
  namespace: shop
  generation: 1
spec:
  parentRefs:
    - name: waypoint
      namespace: mesh
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /alpha
      backendRefs:
        - name: alpha
          port: 8080
status:
  parents:
    - parentRef: {name: waypoint, namespace: mesh, sectionName: hbone}
      controllerName: istio.io/gateway-controller
      conditions:
        - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
    - parentRef: {name: waypoint, namespace: mesh, sectionName: http}
      controllerName: istio.io/gateway-controller
      conditions:
        - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
---
