# Service-parented: excluded from attachment and disclosed as a count.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: legacy
  namespace: app
  generation: 1
spec:
  parentRefs:
    - kind: Service
      name: api
      port: 8080
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /legacy
      backendRefs:
        - name: legacy
          port: 8080
---
