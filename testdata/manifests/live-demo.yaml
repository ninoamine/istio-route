apiVersion: v1
kind: Namespace
metadata:
  name: istio-route-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: istio-route-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: istio-route-demo
spec:
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: istio-route-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - name: http
      port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - demo.example.test
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: demo-web
  namespace: istio-route-demo
spec:
  hosts:
    - demo.example.test
  gateways:
    - demo-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: web.istio-route-demo.svc.cluster.local
            port:
              number: 80
          weight: 100
