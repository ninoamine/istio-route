apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: istio
spec:
  controllerName: istio.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wp-a
  namespace: mesh
  generation: 1
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: hbone
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
status:
  conditions:
    - type: Programmed
      status: "True"
      reason: Programmed
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wp-b
  namespace: mesh
  generation: 1
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: hbone
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
status:
  conditions:
    - type: Programmed
      status: "True"
      reason: Programmed
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: wp-a
  namespace: other
  generation: 1
spec:
  gatewayClassName: istio-waypoint
  listeners:
    - name: hbone
      port: 15008
      protocol: HBONE
      allowedRoutes:
        namespaces:
          from: All
status:
  conditions:
    - type: Programmed
      status: "True"
      reason: Programmed
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ingress
  namespace: edge
  generation: 1
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: primary
  namespace: shop
  generation: 1
spec:
  parentRefs:
    - name: wp-a
      namespace: mesh
    - name: wp-b
      namespace: mesh
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 8080
status:
  parents:
    - parentRef: {name: wp-a, namespace: mesh}
      controllerName: istio.io/gateway-controller
      conditions:
        - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
    - parentRef: {name: wp-b, namespace: mesh}
      controllerName: istio.io/gateway-controller
      conditions:
        - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: only-a
  namespace: shop
  generation: 1
spec:
  parentRefs:
    - name: wp-a
      namespace: mesh
  hostnames:
    - shop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-a
          port: 8080
status:
  parents:
    - parentRef: {name: wp-a, namespace: mesh}
      controllerName: istio.io/gateway-controller
      conditions:
        - {type: Accepted, status: "True", reason: Accepted, observedGeneration: 1}
---
