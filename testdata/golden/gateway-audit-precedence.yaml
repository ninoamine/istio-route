endpointCheck:
  reason: no EndpointSlices were supplied in the offline input
  state: skipped
findings:
- category: precedence
  code: winning-route-rule
  message: HTTPRoute shop/exact-health rule 1 wins over overlapping lower-precedence
    HTTPRoute shop/prefix-root rule 1 (decided by path type)
  resources:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: exact-health
    namespace: shop
    version: v1
  severity: info
  suggestedFix: Review overlapping rules to confirm the winning precedence is intentional.
- category: precedence
  code: partial-overlap-route-rule
  message: HTTPRoute shop/prefix-root rule 1 partially overlaps HTTPRoute shop/exact-health
    rule 1 (decided by path type) and remains eligible for unmatched traffic
  resources:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: prefix-root
    namespace: shop
    version: v1
  severity: info
  suggestedFix: Keep the lower-priority rule only if it intentionally handles traffic
    outside the overlapping match set.
